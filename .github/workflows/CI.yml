# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  windows-audio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile native WASAPI bridge
        shell: powershell
        run: Add-Type -Path scripts/audio/WindowsCapture.cs
      - name: Install compressed audio encoder
        run: choco install ffmpeg --no-progress --yes
      - name: Test clock, source selection and native audio packet handling
        run: python test-node/seminar_audio_test.py
      - name: Check localized capture help
        run: python scripts/seminar_helper.py record --lang zh-CN --help
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"

      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-seminar.txt
      - name: Install replay video encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run benchmark
        timeout-minutes: 4
        run: npm run bench
      - run: npm test
        env:
          CI: true
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-output-${{ matrix.node-version }}
          path: |
            playwright-report/
            test-results/
